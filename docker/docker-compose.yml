# =============================================================================
# docker-compose.yml – CV Recognition Pipeline
# =============================================================================
# Архитектура:
#   camera ──► mediamtx ──► vision-pipeline ──► nats  ──► comparator          ──► nats 
#                                                                │                │
#                                                           postgres/sqlite     nats-queue 
# =============================================================================

version: "3.9"

services:

  # ── MediaMTX: RTSP-прокси ─────────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8890:8890/udp"    # SRT 
      - "8189:8189/udp"   #  (опционально)
      - "8000:8000/udp"
      - "8001:8001/udp"
    volumes:
      - ../src/mediamtx_v1.15.6_linux_amd64/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - cv-net

  # ── NATS: брокер сообщений ────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js"]        # включаем JetStream (очереди с гарантией доставки)
    ports:
      - "4222:4222"
    networks:
      - cv-net

  # ── Container 1: детекция (YOLO) + сегментация (SAM2) ────────────────────
  vision-pipeline:
    build:
      context: ..
      dockerfile: docker-images/vision-pipeline/Dockerfile
    restart: unless-stopped
    container_name: vision-pipeline
    cpus: "24.0"
    depends_on:
      - nats
    environment:
      RTSP_URL:         ${RTSP_URL}
      NATS_URL:         ${NATS_URL}
      NATS_SUBJECT:     ${NATS_SUBJECT}
      YOLO_MODEL_PATH:  ${YOLO_MODEL_PATH}
      CLASSIFIER_ONNX:  ${CLASSIFIER_ONNX}
      DETECTION_CONF:   ${DETECTION_CONF}
      FRAME_SKIP:       ${FRAME_SKIP}
      DEVICE:           ${DEVICE}
    volumes:
      - ../src/vision-pipeline:/app
      - ../input/yolo-test:/app/input
      - ../classification/detection:/app/dataset_detection
      - ../output:/app/output
      - ../models/yolo:/app/models/yolo
      - ../models/onnx:/app/models/onnx
      - ../models/resnet:/app/models/resnet
      - ../models/sam1:/app/models/sam1:ro
      - ../models/sam2:/app/models/sam2:ro
      - dev-dataset:/app/dataset
    networks:
      - cv-net


  # ── ШЕЛ: интерактивный доступ к контейнеру ───────────────────────────────
  # Запустить в фоне:
  #   docker compose -f docker/docker-compose.yml --profile test up -d dev-shell
  # Зайти когда угодно:
  #   docker exec -it vision-pipeline bash
  # Остановить:
  #   docker compose -f docker/docker-compose.yml stop dev-shell
  
  dev-shell:
    build:
      context: ..
      dockerfile: docker-images/vision-pipeline/Dockerfile
    profiles: ["test"]
    container_name: vision-pipeline
    cpus: "4.0"
    environment:
      RTSP_URL:        ${RTSP_URL}
      NATS_URL:        ${NATS_URL}
      NATS_SUBJECT:    ${NATS_SUBJECT}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH}
      CLASSIFIER_ONNX: ${CLASSIFIER_ONNX}
      DETECTION_CONF:  ${DETECTION_CONF}
      FRAME_SKIP:      ${FRAME_SKIP}
      DEVICE:          ${DEVICE}
    volumes:
      - ../src/vision-pipeline:/app
      - ../input/yolo-test:/app/input
      - ../test-classification:/app/test_classification
      - ../output:/app/output
      - ../models/yolo:/app/models/yolo
      - ../models/onnx:/app/models/onnx
      - ../models/resnet:/app/models/resnet
      - ../models/sam1:/app/models/sam1:ro
      - ../models/sam2:/app/models/sam2:ro
      - dev-dataset:/app/dataset
    networks:
      - cv-net
    command: ["sleep", "infinity"]   # просто висит и ждёт
 
  classifier:
    image: python:3.12-slim       
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      NATS_URL:         ${NATS_URL}
      SUB_SUBJECT:      ${CLS_SUB_SUBJECT}
      PUB_SUBJECT:      ${CLS_PUB_SUBJECT}
    networks:
      - cv-net
    # command: ["python", "classifier/main.py"]

  # ── Container 3: компаратор – сравнение с эталоном из БД ─────────────────
  comparator:
    build:
      context: ..
      dockerfile: docker-images/comparator/Dockerfile
    container_name: comparator
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      NATS_URL:       ${NATS_URL}
      VISION_SUBJECT: ${CMP_SUB_SUBJECT}
      SERVER_SUBJECT: ${SERVER_SUBJECT}
  
      DB_SERVER:      ${DB_SERVER}
      DB_PORT:        ${DB_PORT}
      DB_NAME:        ${DB_NAME}
      DB_USERNAME:    ${DB_USERNAME}
      DB_PASSWORD:    ${DB_PASSWORD}
      DB_DRIVER:      ${DB_DRIVER}

      DB_NAME_TDB:    ${DB_NAME_TDB} 
    volumes:
      - ../src/comparator:/app
    networks:
      - cv-net
    command: ["python", "comparator/main.py"]


networks:
  cv-net:
    driver: bridge

volumes:
  db-data:
  dev-input:
  dev-test-classification:
  dev-output:
  dev-dataset:
